name: Coverage

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Run tests under coverage
        env:
          OPENAI_API_KEY: ""
        run: python -m coverage run --source=src -m unittest discover -s tests

      - name: Enforce coverage threshold
        # Current total is ~75%; 72 leaves a small buffer so trivial changes do
        # not break the gate while a real coverage regression still fails CI.
        run: python -m coverage report --fail-under=72
