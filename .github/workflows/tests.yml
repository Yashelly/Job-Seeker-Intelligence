name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify clean dependency resolution
        run: python scripts/verify_clean_deps.py --install

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: python -m ruff check src tests

      - name: Run tests
        env:
          OPENAI_API_KEY: ""
        run: python -m unittest discover -s tests -v

      - name: Verify offline demo seeds data with no credentials
        env:
          OPENAI_API_KEY: ""
          AI_BACKEND: ""
        run: python main.py --demo
