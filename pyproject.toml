[project]
name = "job-seeker-intelligence"
version = "0.2.0"
description = "Multi-source job discovery, analysis, and application tracking from a terminal UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai==2.29.0",
    "playwright==1.54.0",
    "PyYAML==6.0.2",
    "rich==13.9.4",
    "fastapi==0.116.1",
    "Jinja2==3.1.6",
    "uvicorn==0.52.1",
    "httpx==0.28.1",
    "pypdf==6.16.0",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
]
keywords = [
    "job-search",
    "automation",
    "vacancy-scraper",
    "terminal-ui",
    "sqlite",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
]

[project.optional-dependencies]
# Pinned so the lint gate is byte-reproducible across machines and CI.
dev = ["ruff==0.16.3"]

[project.scripts]
job-seeker = "cvbankas_tracker.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# Pinned in-repo so the lint gate is reproducible in CI. Without this, a clean
# CI runner falls back to Ruff's minimal default rule set (E/F only) and the
# gate becomes meaningless; here we opt into a focused, high-signal ruleset.
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
# A focused, high-signal set: correctness (E/F/W), import hygiene (I),
# modernization (UP), likely-bug detection (B), and comprehension clarity (C4).
# The stylistic SIM/PIE/RUF families are deliberately excluded — several of
# their flags here are intentional (e.g. Cyrillic characters inside Lithuanian
# and Russian keyword strings), so the gate stays meaningful rather than noisy.
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
    # FastAPI's dependency-injection idiom is `param: T = Depends(...)`, which
    # B008 flags as a function call in a default argument. It is intentional.
    "B008",
    # A few prompt/HTML string literals are long by nature; reflowing them for
    # line length would hurt readability more than help.
    "E501",
]
